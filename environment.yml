# The Python side of Pyxida: the data pipeline (scripts/) and the tests.
# The demo itself (web/) needs only Node.
#   conda env create -f environment.yml && conda activate pyxida
# Running detectors (scripts/run_detectors.py) needs the TSB-AD package and
# its own environment: https://github.com/TheDatumOrg/TSB-AD
name: pyxida
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=2.4
  - pandas=3.0
  - scipy=1.17
  - scikit-learn=1.8
  - pyarrow=24.0
  - networkx=3.7
  - matplotlib=3.10
  - seaborn=0.13
  - tqdm
  - pytest
