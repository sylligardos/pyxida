<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Needle · Round summary, arcade</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Space+Grotesk:wght@400;500;700&amp;family=Space+Mono:wght@400;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0B0A1F}
</style>
</helmet>
<div style="min-height: 100vh; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 26px; padding: 28px 32px 32px; background-color: #0B0A1F; background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px); background-size: 24px 24px; color: #F4F1FF; font-family: 'Space Grotesk', system-ui, sans-serif">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
    <span style="font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #FFE14D">Six series · 02:31</span>
    <h1 style="margin: 0; font-family: 'Bungee', 'Space Grotesk', sans-serif; font-weight: 400; font-size: clamp(3rem, 7vw, 5.5rem); line-height: 0.95; color: #F4F1FF; text-shadow: -4px 0 0 #22D3EE, 4px 0 0 #FF3D9A">YOU WIN</h1>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 28px; flex-wrap: wrap">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 40px; border-radius: 14px; border: 3px solid #FF3D9A; background: rgba(255, 61, 154, 0.08); box-shadow: 0 0 36px rgba(255, 61, 154, 0.35); min-width: 200px">
      <span style="font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #FFB8D9">[NAME]</span>
      <span style="font-family: 'Bungee', sans-serif; font-size: 88px; line-height: 1; color: #FF3D9A">{{you}}</span>
      <span style="font-family: 'Bungee', sans-serif; font-size: 16px; color: #FF3D9A">YOU</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <span style="font-family: 'Bungee', sans-serif; font-size: 36px; color: #FFE14D">VS</span>
      <span style="font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; color: #F4F1FF; padding: 4px 10px; border-radius: 4px; background: #2C2754">{{tally}}</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 40px; border-radius: 14px; border: 3px solid #22D3EE; background: rgba(34, 211, 238, 0.06); min-width: 200px">
      <span style="font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #A5F3FC">Team of 5</span>
      <span style="font-family: 'Bungee', sans-serif; font-size: 88px; line-height: 1; color: #22D3EE">{{det}}</span>
      <span style="font-family: 'Bungee', sans-serif; font-size: 16px; color: #22D3EE">DETECTORS</span>
    </div>
  </div>

  <p style="margin: 0; text-align: center; font-size: 18px; color: #C9C3E6">You played <span style="font-family: 'Space Mono', monospace; font-weight: 700; color: #22D3EE">2</span> easy, <span style="font-family: 'Space Mono', monospace; font-weight: 700; color: #F4F1FF">2</span> medium, <span style="font-family: 'Space Mono', monospace; font-weight: 700; color: #FF3D9A">1</span> unsolved, <span style="font-family: 'Space Mono', monospace; font-weight: 700; color: #FFE14D">1</span> decoy.</p>

  <div style="width: 100%; max-width: 1376px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px">
    <sc-for list="{{series}}" as="s" hint-placeholder-count="6">
      <article style="border-radius: 12px; border: 2px solid {{s.frame}}; background: #15132E; overflow: hidden; display: flex; flex-direction: column; box-shadow: {{s.glow}}; opacity: {{s.cardOpacity}}">
        <div style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 30px; background: {{s.banner.bg}}; color: {{s.banner.fg}}; font-family: 'Bungee', sans-serif; font-size: 12px; letter-spacing: 0.04em; white-space: nowrap">
          <sc-if value="{{s.banner.dots}}" hint-placeholder-val="{{ false }}">
            <span style="width: 9px; height: 9px; transform: rotate(45deg); background: #FF3D9A"></span>
          </sc-if>
          <span>{{s.banner.text}}</span>
          <sc-if value="{{s.banner.dots}}" hint-placeholder-val="{{ false }}">
            <span style="width: 9px; height: 9px; transform: rotate(45deg); background: #22D3EE"></span>
          </sc-if>
        </div>
        <div style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
            <span style="font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; color: #C9C3E6">{{s.id}}</span>
            <span style="font-family: 'Bungee', sans-serif; font-size: 11px; letter-spacing: 0.04em; padding: 3px 7px; border-radius: 3px; background: {{s.tierBg}}; color: {{s.tierFg}}">{{s.tier}}</span>
          </div>
          <dc-import name="Chart" theme="arcade" seed="{{s.seed}}" n="{{s.n}}" kind="{{s.kind}}" anomaly="{{s.anomaly}}" player="{{s.none}}" det="{{s.none}}" truth="{{s.on}}" axes="{{s.off}}" score="{{s.off}}" h="{{s.h}}" panel="#07061A" stroke="#BEB8E6" hint-size="100%,64px"></dc-import>
          <div style="display: flex; flex-direction: column; gap: 4px; font-size: 13px">
            <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="2">
              <div style="display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; background: {{r.bg}}; border: 1px solid {{r.border}}; opacity: {{r.opacity}}">
                <span style="width: 9px; height: {{r.markH}}px; flex: none; box-sizing: border-box; transform: {{r.markRot}}; background: {{r.markFill}}; border: 2px solid {{r.color}}"></span>
                <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2">
                  <span style="font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; color: {{r.color}}">{{r.who}}</span>
                  <span style="color: #F4F1FF">{{r.result}}</span>
                </span>
                <span style="font-family: 'Bungee', sans-serif; font-size: 14px; color: {{r.color}}">{{r.pts}}</span>
              </div>
            </sc-for>
          </div>
        </div>
      </article>
    </sc-for>
  </div>

  <div style="width: 100%; max-width: 1376px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
    <p style="margin: 0; font-size: 13px; color: #A9A2D4">+1 found it or left a decoy clean · 0 missed · −1 false alarm</p>
    <div style="display: flex; gap: 14px; flex-wrap: wrap; align-items: center">
      <button type="button" style="height: 58px; padding: 0 26px; border-radius: 8px; border: 2px solid #F4F1FF; background: transparent; color: #F4F1FF; font-family: 'Bungee', sans-serif; font-size: 17px; cursor: pointer">LEADERBOARD</button>
      <button type="button" style="height: 58px; padding: 0 40px; border-radius: 8px; border: 0; background: #FFE14D; color: #1C1500; font-family: 'Bungee', sans-serif; font-size: 22px; box-shadow: 0 6px 0 #B89A0E; cursor: pointer">PLAY AGAIN</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const PINK = '#FF3D9A', CYAN = '#22D3EE';
    const pts = { 'found': 1, 'clean': 1, 'missed': 0, 'false alarm': -1 };
    const label = { 'found': 'Found it', 'clean': 'Left it clean', 'missed': 'Missed', 'false alarm': 'False alarm' };
    const mark = {
      'found': { fill: true, h: 9, rot: 'rotate(45deg)' },
      'clean': { fill: true, h: 9, rot: 'rotate(45deg)' },
      'missed': { fill: false, h: 9, rot: 'rotate(45deg)' },
      'false alarm': { fill: true, h: 4, rot: 'none' },
    };
    const tierLook = {
      Easy: [CYAN, '#04161A'], Medium: ['#2C2754', '#F4F1FF'],
      Unsolved: [PINK, '#1A0612'], Decoy: ['#FFE14D', '#1C1500'],
    };
    const rows = [
      { seed: 3, n: 2400, kind: 'shift', anomaly: [0.4, 0.47], tier: 'Easy', you: 'found', det: 'found' },
      { seed: 9, n: 1800, kind: 'point', anomaly: [0.7, 0.7], tier: 'Easy', you: 'found', det: 'found' },
      { seed: 14, n: 4800, kind: 'freq', anomaly: [0.52, 0.58], tier: 'Unsolved', you: 'found', det: 'missed' },
      { seed: 22, n: 3600, kind: 'freq', anomaly: [0.3, 0.36], tier: 'Medium', you: 'missed', det: 'found' },
      { seed: 31, n: 5200, kind: 'none', anomaly: [0, 0], tier: 'Decoy', you: 'clean', det: 'false alarm' },
      { seed: 40, n: 6800, kind: 'freq', anomaly: [0.74, 0.8], tier: 'Medium', you: 'missed', det: 'missed' },
    ];
    const fmt = (v) => (v > 0 ? '+' + v : v < 0 ? '−' + (-v) : '0');
    let youTotal = 0, detTotal = 0, youWins = 0, detWins = 0, ties = 0;
    const series = rows.map((r) => {
      const y = pts[r.you], d = pts[r.det];
      youTotal += y; detTotal += d;
      let outcome;
      if (y > d) { outcome = 'you'; youWins++; }
      else if (d > y) { outcome = 'det'; detWins++; }
      else { outcome = y > 0 ? 'both' : 'nobody'; ties++; }
      const lit = { you: outcome === 'you' || outcome === 'both', det: outcome === 'det' || outcome === 'both' };
      const row = (who, key, color, on) => ({
        who, color,
        result: label[key], pts: fmt(pts[key]),
        markH: mark[key].h, markRot: mark[key].rot, markFill: mark[key].fill ? color : 'transparent',
        bg: on ? (color === PINK ? 'rgba(255, 61, 154, 0.16)' : 'rgba(34, 211, 238, 0.14)') : 'transparent',
        border: on ? color : 'transparent',
        opacity: on || outcome === 'nobody' ? 1 : 0.5,
      });
      const banner = {
        you: { text: 'YOU WIN', bg: PINK, fg: '#1A0612', dots: false },
        det: { text: 'DETECTORS WIN', bg: CYAN, fg: '#04161A', dots: false },
        both: { text: 'TIE · BOTH FOUND IT', bg: '#F4F1FF', fg: '#10061A', dots: true },
        nobody: { text: 'TIE · NOBODY FOUND IT', bg: '#2C2754', fg: '#C9C3E6', dots: false },
      }[outcome];
      return {
        seed: r.seed, n: r.n, kind: r.kind, anomaly: r.anomaly,
        id: 'SERIES ' + r.seed,
        tier: r.tier.toUpperCase(), tierBg: tierLook[r.tier][0], tierFg: tierLook[r.tier][1],
        banner,
        frame: outcome === 'you' ? PINK : outcome === 'det' ? CYAN : outcome === 'both' ? '#7D76AE' : '#2C2754',
        glow: outcome === 'you' ? '0 0 20px rgba(255, 61, 154, 0.3)' : outcome === 'det' ? '0 0 20px rgba(34, 211, 238, 0.25)' : 'none',
        cardOpacity: outcome === 'nobody' ? 0.85 : 1,
        none: [], on: true, off: false, h: 64,
        rows: [row('YOU', r.you, PINK, lit.you), row('DETECTORS', r.det, CYAN, lit.det)],
      };
    });
    return {
      you: String(youTotal), det: String(detTotal),
      tally: youWins + ' W · ' + detWins + ' L · ' + ties + ' T',
      series,
    };
  }
}
</script>
</body>
</html>
